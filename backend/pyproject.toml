[project]
name = "takeplace-backend"
version = "0.1.0"
description = "Takeplace backend — FastAPI, SQLAlchemy 2 async, PostgreSQL."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "structlog>=24.4,<26.0",
  "httpx>=0.27,<1.0",
  "argon2-cffi>=23.1,<26.0",
  # IANA timezone database for ``zoneinfo`` on platforms without a system tz
  # database (notably Windows). Venue timezone validation requires it (§53).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  # Property-based tests for occupancy segment algebra and capacity sweeps (§55).
  "hypothesis>=6.100,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-python-dateutil>=2.9",
]

[project.scripts]
takeplace = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Asserts, placeholder credentials and CLI subprocess orchestration are
# expected in tests.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["app.db.models"]
# SQLAlchemy declarative models rely on dynamic attribute assignment.
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# asyncpg ships no ``py.typed`` marker; the realtime listener owns the only
# direct import, and SQLAlchemy handles the request-path driver typing.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a live PostgreSQL instance (set TAKEPLACE_TEST_DATABASE_URL)",
]
