# =============================================================================
# Takeplace — local development stack.
#
#   bash scripts/dev.sh          # recommended: creates .env, builds, migrates, starts
#   docker compose up --build    # equivalent raw command
#
# Services wait on real readiness signals (pg_isready / healthcheck) and on the
# one-shot `migrate` service completing successfully — never on sleeps.
# =============================================================================

name: takeplace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TAKEPLACE_POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${TAKEPLACE_POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: ${TAKEPLACE_POSTGRES_DB:?set in .env}
      # Consumed by infra/postgres/init/*.sh on first volume creation.
      TAKEPLACE_DB_MIGRATOR_USER: ${TAKEPLACE_DB_MIGRATOR_USER:?set in .env}
      TAKEPLACE_DB_MIGRATOR_PASSWORD: ${TAKEPLACE_DB_MIGRATOR_PASSWORD:?set in .env}
      TAKEPLACE_DB_APP_USER: ${TAKEPLACE_DB_APP_USER:?set in .env}
      TAKEPLACE_DB_APP_PASSWORD: ${TAKEPLACE_DB_APP_PASSWORD:?set in .env}
      TAKEPLACE_DB_STATEMENT_TIMEOUT_MS: ${TAKEPLACE_DB_STATEMENT_TIMEOUT_MS:-10000}
      TAKEPLACE_DB_LOCK_TIMEOUT_MS: ${TAKEPLACE_DB_LOCK_TIMEOUT_MS:-3000}
      TAKEPLACE_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${TAKEPLACE_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-15000}
      TAKEPLACE_DB_MIGRATION_STATEMENT_TIMEOUT_MS: ${TAKEPLACE_DB_MIGRATION_STATEMENT_TIMEOUT_MS:-300000}
    ports:
      # Bound to loopback only: PostgreSQL is never exposed to the network (§46).
      - "127.0.0.1:${TAKEPLACE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: takeplace-backend:dev
    profiles: []
    restart: "no"
    env_file:
      - .env
    environment:
      TAKEPLACE_DB_HOST: postgres
      TAKEPLACE_DB_PORT: "5432"
      TAKEPLACE_DB_NAME: ${TAKEPLACE_POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: takeplace-backend:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TAKEPLACE_DB_HOST: postgres
      TAKEPLACE_DB_PORT: "5432"
      TAKEPLACE_DB_NAME: ${TAKEPLACE_POSTGRES_DB}
      # Bind all interfaces inside the container; the host port is loopback-only.
      TAKEPLACE_API_HOST: 0.0.0.0
      TAKEPLACE_API_PORT: "8000"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      # The structured middleware logs paths only; raw access logs leak phone searches.
      - --no-access-log
      # Trust X-Forwarded-* only from explicitly configured proxies (§39.5).
      - --proxy-headers
      - --forwarded-allow-ips
      - ${TAKEPLACE_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${TAKEPLACE_API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.healthcheck --url http://127.0.0.1:8000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: takeplace-frontend:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Vite proxies /api to the API service inside the compose network.
      TAKEPLACE_FRONTEND_PROXY_TARGET: http://api:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${TAKEPLACE_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  frontend-node-modules:
