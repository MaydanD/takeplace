# =============================================================================
# Takeplace frontend — static SPA server.
#
# Serves the Vite build out of /usr/share/nginx/html. Everything below /api and
# /health is handled by Caddy before the request ever reaches this container, so
# this server only ever answers document + asset requests and never falls back to
# index.html for an API call.
#
# Security headers are applied by Caddy (one place, one policy); this config only
# covers caching and the SPA fallback.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are content-addressed and safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document references hashed assets, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: real files are served as files; any other path (a deep React
    # Router route opened directly or after an F5) returns index.html and lets the
    # client-side router take over.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # nginx's own liveness probe target.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
